name: CharaDock macOS arm64 experimental package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned macOS arm64 app with Beatrice host
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout CharaDock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout Steinberg VST3 SDK
        shell: bash
        run: |
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git -C "$RUNNER_TEMP/vst3sdk" checkout --detach 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0
          git -C "$RUNNER_TEMP/vst3sdk" submodule update --init --recursive --depth 1

      - name: Configure arm64 host
        shell: bash
        run: |
          cmake -S native/beatrice-host -B "$RUNNER_TEMP/beatrice-host-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DVST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk"

      - name: Build and verify arm64 host
        shell: bash
        run: |
          cmake --build "$RUNNER_TEMP/beatrice-host-build" --config Release --parallel 3
          cmake --install "$RUNNER_TEMP/beatrice-host-build" --config Release --prefix "$GITHUB_WORKSPACE/native/bin"
          file native/bin/charadock-beatrice-host
          lipo -archs native/bin/charadock-beatrice-host | grep -qw arm64

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build unsigned macOS arm64 application
        run: npm run dist:mac:arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify application and create checksums
        shell: bash
        run: |
          bundled_host="dist/mac-arm64/CharaDock.app/Contents/Resources/bin/charadock-beatrice-host"
          test -x "$bundled_host"
          lipo -archs "$bundled_host" | grep -qw arm64
          for artifact in dist/*.dmg dist/*.zip; do
            shasum -a 256 "$artifact" | sed 's#  dist/#  #'
          done > dist/SHA256SUMS-macos-arm64.txt

      - name: Upload unsigned experimental package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: charadock-macos-arm64-experimental
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error
          retention-days: 14
