name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.mjs'
      - 'scripts/build_character_previews.cjs'
      - 'docs/images/charadock-hero.webp'
      - 'docs/images/charadock-work-mode.png'
      - 'docs/images/characters/**'
      - 'app-icon.ico'
      - 'app-icon.png'
      - 'assets/amber-avatar/back-hair.png'
      - 'assets/amber-avatar/front-hair.png'
      - 'assets/amber-avatar/eyes-open-mouth-closed.png'
      - 'assets/bronze-avatar/back-hair.png'
      - 'assets/bronze-avatar/front-hair.png'
      - 'assets/bronze-avatar/eyes-open-mouth-closed.png'
      - 'assets/towa-avatar/back-hair.png'
      - 'assets/towa-avatar/front-hair.png'
      - 'assets/towa-avatar/eyes-open-mouth-closed.png'
      - 'assets/sage-avatar/back-hair.png'
      - 'assets/sage-avatar/front-hair.png'
      - 'assets/sage-avatar/eyes-open-mouth-closed.png'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build static site
        run: npm run site:build

      - name: Verify committed character previews are current
        run: git diff --exit-code -- docs/images/characters

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site-dist

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
