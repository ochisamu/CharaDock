<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: charadock-artifact:; media-src 'self' data: blob: charadock-artifact:; frame-src charadock-artifact: http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>CharaDock Preview</title>
  <link rel="stylesheet" href="/vendor/highlightjs/11.11.1/styles/github-dark-dimmed.min.css" />
  <link rel="stylesheet" href="/desktop/artifact-preview.css" />
</head>
<body>
  <main class="preview-window">
    <header class="preview-titlebar">
      <div class="preview-heading">
        <p>PREVIEW</p>
        <h1 id="previewTitle">読み込み中…</h1>
        <small id="previewPath"></small>
      </div>
      <div class="preview-actions">
        <button id="openButton" class="text-button" type="button"><span class="symbol symbol-external" aria-hidden="true"></span><span id="openButtonLabel">外部で開く</span></button>
        <button id="closeButton" class="icon-button" type="button" aria-label="閉じる" title="閉じる"><span class="symbol symbol-close" aria-hidden="true"></span></button>
      </div>
    </header>
    <section id="previewBody" class="preview-body" aria-live="polite">
      <div class="preview-loading"><i></i><span>プレビューを準備しています…</span></div>
    </section>
    <p id="previewStatus" class="preview-status" role="status" hidden></p>
  </main>
  <script src="/vendor/highlightjs/11.11.1/highlight.min.js"></script>
  <script src="/vendor/markdown-it/14.3.0/markdown-it.min.js"></script>
  <script src="/vendor/dompurify/3.4.13/purify.min.js"></script>
  <script src="/desktop/artifact-preview.js"></script>
</body>
</html>
